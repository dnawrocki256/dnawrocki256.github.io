  <html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="teamName">Team Page</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1 id="teamHeader"></h1>

  <div class="text-block">
    Year on year summary graphs for the team (points on the graphs indicate end of season, not end of year)
  </div>

  <h2>Relative Position</h2>
  <div class="elo-graph">
    <canvas id="positionChart"></canvas>
  </div>

  <h2>Position</h2>
  <div class="elo-graph">
    <canvas id="absPositionChart"></canvas>
  </div>

  <h2>Elo Score</h2>
  <div class="elo-graph">
    <canvas id="eloChart"></canvas>
  </div>

  <script>
    let teamSlug = window.location.pathname.split("/").pop().replace(".html", "");
    let teamJsonName = teamSlug.replace(/-/g, " ");

    fetch(`/elo/team_json/${teamJsonName}.json`)
      .then(r => r.json())
      .then(data => {
        const teamName = data[0].club_full;
        const countryCode = data[0].country;
        document.getElementById("teamHeader").innerHTML =
          `<img src="/elo/flags/${countryCode}.svg" class="flag" style="width:auto; height:1.6rem; margin-right:0.4em;"> ${teamName}`;
        document.getElementById("teamName").textContent = teamName + " Elo & Ranking";

        const minYear = Math.min(...data.map(d => d.year));
        const maxYear = Math.max(...data.map(d => d.year));

        const years = [];
        const ranks = [];
        const totalTeams = [];
        const elos = [];
        const seriesBreaks = [];

        for (let y = minYear; y <= maxYear; y++) {
          const entry = data.find(d => Number(d.year) === y);
          years.push(y);
          if (entry && entry[`${y}_rank`] != null) {
            ranks.push(entry[`${y}_rank`]);
            totalTeams.push(entry.total_teams);
            elos.push(entry[`${y}_elo`]);
            seriesBreaks.push(!!entry.series_break);
          } else {
            ranks.push(null);
            totalTeams.push(null);
            elos.push(null);
            seriesBreaks.push(false);
          }
        }

        const relativePosition = ranks.map((rank, i) => {
          if (rank == null || totalTeams[i] == null) return null;
          return 1 - (rank - 1) / (totalTeams[i] - 1);
        });

        // Insert null in the **previous year** if current year is a series_break
        const displayRanks = [...ranks];
        const displayRelPos = [...relativePosition];
        const displayElos = [...elos];

        for (let i = 1; i < ranks.length; i++) {
          if (seriesBreaks[i]) {
            displayRanks[i - 1] = null;
            displayRelPos[i - 1] = null;
            displayElos[i - 1] = null;
          }
        }

        // Minimum Elo vertical span
        const actualMin = Math.min(...elos.filter(v => v != null));
        const actualMax = Math.max(...elos.filter(v => v != null));
        const minSpan = 20;
        let yMin = actualMin;
        let yMax = actualMax;
        if ((yMax - yMin) < minSpan) {
          const extra = (minSpan - (yMax - yMin)) / 2;
          yMin -= extra;
          yMax += extra;
        }

        new Chart(document.getElementById("positionChart"), {
          type: "line",
          data: {
            labels: years,
            datasets: [{ label: "Relative Position", data: displayRelPos, borderColor: "blue", fill: false, tension: 0.1 }]
          },
          options: {
            spanGaps: false,
            plugins: {
              tooltip: {
                callbacks: {
                  label: ctx => {
                    const idx = ctx.dataIndex;
                    const score = displayElos[idx];
                    const rank = displayRanks[idx];
                    const total = totalTeams[idx];
                    return rank == null ? "Not ranked" : `Rank: ${rank} / ${total}, Elo: ${score}`;
                  }
                }
              }
            },
            scales: { y: { min: 0, max: 1, reverse: false, title: { display: true, text: "Position (1 = top)" } } }
          }
        });

        new Chart(document.getElementById("absPositionChart"), {
          type: "line",
          data: {
            labels: years,
            datasets: [{ label: "Position", data: displayRanks, borderColor: "blue", fill: false, tension: 0.1 }]
          },
          options: {
            spanGaps: false,
            plugins: {
              tooltip: {
                callbacks: {
                  label: ctx => {
                    const idx = ctx.dataIndex;
                    const score = displayElos[idx];
                    const rank = displayRanks[idx];
                    return rank == null ? "Not ranked" : `Rank: ${rank}, Elo: ${score}`;
                  }
                }
              }
            },
            scales: { y: { type: 'linear', reverse: true, ticks: { stepSize: 1 }, title: { display: true, text: "Position" } } }
          }
        });

        new Chart(document.getElementById("eloChart"), {
          type: "line",
          data: {
            labels: years,
            datasets: [{ label: "Elo Score", data: displayElos, borderColor: "red", fill: false, tension: 0.1 }]
          },
          options: {
            spanGaps: false,
            plugins: {
              tooltip: {
                callbacks: {
                  label: ctx => {
                    const idx = ctx.dataIndex;
                    const score = displayElos[idx];
                    const rank = displayRanks[idx];
                    return score == null ? "Not ranked" : `Elo: ${score}, Rank: ${rank}`;
                  }
                }
              }
            },
            scales: { y: { type: 'linear', reverse: false, suggestedMin: yMin, suggestedMax: yMax, title: { display: true, text: "Elo Score" } } }
          }
        });

      });
  </script>
</body>
